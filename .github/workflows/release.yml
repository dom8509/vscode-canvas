# Builds the extension for every version tag (v1.2.3) and attaches the .vsix
# to a GitHub release of that tag.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tag decides the version: v1.2.3 packages as 1.2.3.
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Typecheck, tests and build, then the .vsix.
      - run: npm run package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.vsix \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
