<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f77"/>
      <stop offset="1" stop-color="#6a3fd1"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.4" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b0b2a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Board -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#dots)"/>

  <!-- Connections -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M 104 78 C 140 78, 140 64, 162 64"/>
    <path d="M 72 104 C 72 140, 92 168, 112 168" stroke-dasharray="1 13"/>
  </g>
  <polygon points="176,64 160,55 160,73" fill="#ffffff" fill-opacity="0.9"/>
  <polygon points="126,168 110,159 110,177" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Cards -->
  <g filter="url(#shadow)">
    <rect x="36" y="52" width="72" height="52" rx="12" fill="#ffffff"/>
    <rect x="176" y="40" width="48" height="48" rx="12" fill="#ffd166"/>
    <rect x="126" y="136" width="92" height="64" rx="12" fill="#ffffff"/>
  </g>

  <!-- Text lines on the cards -->
  <g stroke="#6a3fd1" stroke-width="6" stroke-linecap="round" stroke-opacity="0.55">
    <path d="M 50 70 H 92"/>
    <path d="M 50 86 H 78"/>
    <path d="M 142 156 H 200"/>
    <path d="M 142 172 H 186"/>
    <path d="M 142 186 H 170" stroke-opacity="0.3"/>
  </g>
</svg>
